  <title
     id="title2">Developmental lineage tree of germ-layer hypervariability categories</title>
  <desc
     id="desc4">A phylogeny-style tree: a systemic pre-gastrulation trunk carrying the allLayers category splits at gastrulation into endoderm, mesoderm and ectoderm branches ending in the three layer-specific categories.</desc>
